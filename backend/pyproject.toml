[project]
name = "redline"
version = "0.1.0"
description = "Redline contracts with JSON change requests, search them, and ask a model for suggested edits."
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.11.0",
    "fastapi>=0.165.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.2",
    "hypothesis>=6.170.16",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.6",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
strict = true
files = ["src", "tests", "bench.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["redline"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 100
